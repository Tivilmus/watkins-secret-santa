<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watkins Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout: one narrow phone-first column on a night-pine field; the gift reveal is the one raised element. */
  --pine:#0f2a22;
  --pine-2:#173a2f;
  --pine-3:#21503f;
  --snow:#f4f1e8;
  --frost:#a8c1b5;
  --gold:#e3b75c;
  --berry:#c9433b;
  --font-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--pine);color:var(--snow);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 18px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.4rem}
h2{font-size:1.45rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--frost)}
.small{font-size:.88rem}
.head{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--pine-2);border:1px solid var(--pine-3);font-size:.88rem;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold);font-weight:600}
.panel{background:var(--pine-2);border:1px solid var(--pine-3);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.names{grid-template-columns:1fr}}
.name-btn{font:inherit;font-weight:600;font-size:1.05rem;color:var(--snow);background:var(--pine-2);border:1px solid var(--pine-3);border-radius:12px;padding:16px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.name-btn:hover{border-color:var(--gold);background:var(--pine-3)}
.name-btn span{color:var(--gold);font-size:1.1rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--gold);color:#1d1606}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--snow);border-color:var(--pine-3)}
.btn-ghost:hover{border-color:var(--frost)}
.btn-danger{background:var(--berry);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--gold);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
label{font-weight:600;font-size:.92rem;display:block;margin-bottom:6px}
.hint{font-size:.84rem;color:var(--frost);margin-top:5px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;color:var(--snow);background:var(--pine);border:1px solid var(--pine-3);border-radius:9px;padding:10px 12px}
textarea{resize:vertical;min-height:120px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.row2{grid-template-columns:1fr}}
.pair-add{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}
@media (max-width:420px){.pair-add{grid-template-columns:1fr 1fr}.pair-add .amp{display:none}.pair-add .btn{grid-column:1/-1}}
.amp{color:var(--frost)}
.pairs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.pairs li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--pine);border:1px solid var(--pine-3);font-size:.95rem}
.x{background:none;border:0;color:var(--frost);font:inherit;font-size:1.1rem;cursor:pointer;padding:2px 6px}
.x:hover{color:var(--snow)}
.notice{border-left:3px solid var(--gold);padding:10px 14px;background:var(--pine-2);border-radius:0 10px 10px 0;font-size:.94rem}
.notice.err{border-color:var(--berry)}
.msg{font-size:.92rem;min-height:1.2em}
.msg.err{color:#ff9a90}
.msg.ok{color:var(--gold)}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
details.org{border-top:1px solid var(--pine-3);padding-top:16px}
details.org summary{cursor:pointer;color:var(--frost);font-size:.9rem}
details.org .inner{display:flex;flex-direction:column;gap:12px;margin-top:14px}
pre.copy{white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--pine);border:1px solid var(--pine-3);border-radius:9px;padding:12px;margin:0}
.btn-sm{padding:7px 12px;font-size:.85rem}
.codes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.codes li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--pine);border:1px solid var(--pine-3)}
.codes .cn{font-weight:600;overflow-wrap:anywhere}
.codes code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.code-form{display:flex;flex-direction:column;gap:14px}
.code-in{text-align:center;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:1.6rem !important;letter-spacing:.18em;text-transform:uppercase;padding:14px !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* modal */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(6,18,14,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:440px;background:var(--pine-2);border:1px solid var(--pine-3);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;text-align:center;max-height:100%;overflow-y:auto}
.sheet .btn-row{justify-content:center}
/* gift */
.gift-wrap{display:flex;justify-content:center;padding:52px 0 4px}
.gift{position:relative;width:150px;height:140px;cursor:pointer;background:none;border:0;padding:0}
.gift .box{position:absolute;left:10px;right:10px;bottom:0;height:92px;background:var(--berry);border-radius:6px}
.gift .lid{position:absolute;left:0;right:0;top:22px;height:30px;background:#dc5148;border-radius:6px;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-origin:20% 100%}
.gift .rib-v{position:absolute;left:50%;width:18px;margin-left:-9px;top:22px;bottom:0;background:var(--gold)}
.gift .lid .rib-v{top:0;bottom:0}
.gift .bow{position:absolute;left:50%;top:-20px;width:60px;height:26px;margin-left:-30px}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;top:0;width:28px;height:22px;border:5px solid var(--gold);border-radius:50% 50% 50% 50%}
.gift .bow::before{left:0;transform:rotate(-18deg)}
.gift .bow::after{right:0;transform:rotate(18deg)}
.gift.open .lid{transform:translate(-8px,-26px) rotate(-16deg)}
.gift:not(.open){animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}94%{transform:rotate(-2deg)}}
.result{display:flex;flex-direction:column;gap:8px;align-items:center}
.result .who{font-family:var(--font-display);font-size:2.6rem;color:var(--gold);line-height:1.05;overflow-wrap:anywhere}
.result.hidden{display:none}
.tap-note{font-size:.9rem;color:var(--frost)}
@media (prefers-reduced-motion:reduce){.gift:not(.open){animation:none}.gift .lid{transition:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main id="app"></main>
<script id="state" type="application/json">{"drawn":true,"title":"Watkins Secret Santa","budget":"$150","date":"2026-12-25","note":"","names":["Mom","Zach","Rebecca","Ryan","Alyssa","Grandma"],"pairs":[["Rebecca","Ryan"]],"salt":2016187048,"enc":"E0eHIK2urg7w1MnB","drawnAt":"2026-11-06"}</script>
<script id="app-js">
(function(){
  "use strict";
  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">';
  var STATE = JSON.parse(document.getElementById("state").textContent);
  var app = document.getElementById("app");

  var apiP = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("artifact").catch(function(){ return null; })
    : Promise.resolve(null);

  var LS = {
    get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* ---------- scrambling: keeps the list unreadable in the page source (honor system) ---------- */
  function prng(seed){ var s = seed >>> 0; return function(){ s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return (t ^ (t >>> 14)) >>> 0; }; }
  function encode(perm, salt){ var r = prng(salt), out = ""; for (var i=0;i<perm.length;i++){ var b = (perm[i] ^ r()) & 0xffff; out += String.fromCharCode(b >> 8, b & 255); } return btoa(out); }
  function decodeOne(enc, salt, i){ var bin = atob(enc), r = prng(salt), k = 0; for (var j=0;j<=i;j++) k = r(); var b = (bin.charCodeAt(2*i) << 8) | bin.charCodeAt(2*i+1); return (b ^ k) & 0xffff; }
  function copyText(text, msgEl){
    function fail(){ msgEl.className = "msg"; msgEl.textContent = "Couldn't copy here. Press and hold the text to copy it."; }
    try { navigator.clipboard.writeText(text).then(function(){ msgEl.className = "msg ok"; msgEl.textContent = "Copied."; }, fail); } catch(e){ fail(); }
  }

  /* ---------- the draw ---------- */
  function rand(n){ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j = rand(i+1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n){ var a=[]; for (var i=0;i<n;i++) a.push(i); return a; }
  function solve(n, banned, avoidMutual){
    var recv = new Array(n).fill(-1), taken = new Array(n).fill(false), order = shuffle(range(n)), steps = 0;
    function bt(k){
      if (++steps > 40000) return false;
      if (k === n) return true;
      var g = order[k], c = shuffle(range(n));
      for (var x=0;x<c.length;x++){
        var r = c[x];
        if (r === g || taken[r] || banned[g+"-"+r]) continue;
        if (avoidMutual && recv[r] === g) continue;
        recv[g] = r; taken[r] = true;
        if (bt(k+1)) return true;
        recv[g] = -1; taken[r] = false;
      }
      return false;
    }
    return bt(0) ? recv : null;
  }
  function drawNames(n, pairs, names){
    var banned = {};
    pairs.forEach(function(p){ var a = names.indexOf(p[0]), b = names.indexOf(p[1]); if (a>-1 && b>-1){ banned[a+"-"+b] = true; banned[b+"-"+a] = true; } });
    for (var pass=0; pass<2; pass++){
      var avoid = pass === 0 && n >= 4;
      for (var t=0;t<25;t++){ var res = solve(n, banned, avoid); if (res) return res; }
    }
    return null;
  }

  /* ---------- saving: the page republishes itself with the new state ---------- */
  function buildDoc(st){
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("app-js").textContent;
    var json = JSON.stringify(st).replace(/</g, "\\u003c");
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Watkins Secret Santa</title>\n' + FONTS +
      '\n<style id="css">' + css + '</style>\n</head>\n<body>\n<canvas id="snow" aria-hidden="true"></canvas>\n<main id="app"></main>\n<script id="state" type="application/json">' + json +
      '<\/script>\n<script id="app-js">' + js + '<\/script>\n</body>\n</html>';
  }
  function save(st, msgEl){
    msgEl.className = "msg"; msgEl.textContent = "Saving…";
    return apiP.then(function(api){
      if (!api){ msgEl.className = "msg err"; msgEl.textContent = "Saving only works on the page's own link. Open it from your artifacts (not the chat preview) and try again."; return false; }
      return api.publish(buildDoc(st)).then(function(){ msgEl.className = "msg ok"; msgEl.textContent = "Saved. Reloading…"; return true; }, function(e){
        var code = String((e && (e.code || e.name || e.message)) || "");
        msgEl.className = "msg err";
        if (/not_granted|not_writer/.test(code)) msgEl.textContent = "Only the organizer who made this page can do that.";
        else if (/conflict/.test(code)) msgEl.textContent = "The page was just updated somewhere else and will reload.";
        else msgEl.textContent = "That didn't save. Check your connection and try again.";
        return false;
      });
    });
  }

  /* ---------- helpers ---------- */
  function fmtDate(d){ if (!d) return ""; var dt = new Date(d + "T12:00:00"); if (isNaN(dt)) return d; return dt.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}); }
  function daysTo(d){ if (!d) return null; var dt = new Date(d + "T00:00:00"), now = new Date(); now.setHours(0,0,0,0); var n = Math.round((dt - now) / 86400000); return isNaN(n) ? null : n; }
  function countdown(d){ var n = daysTo(d); if (n === null) return ""; if (n > 1) return n + " days to go"; if (n === 1) return "Tomorrow"; if (n === 0) return "Today!"; return "Done for this year"; }
  function metaChips(st){
    var h = '<div class="chips">';
    if (st.budget) h += '<span class="chip">Budget <b>' + esc(st.budget) + '</b></span>';
    if (st.date) h += '<span class="chip">Exchange <b>' + esc(fmtDate(st.date)) + '</b></span>';
    var c = countdown(st.date); if (c) h += '<span class="chip">' + esc(c) + '</span>';
    if (st.drawn) h += '<span class="chip">' + st.names.length + ' people</span>';
    return h + '</div>';
  }
  function modal(html){
    var o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
    o.innerHTML = '<div class="sheet">' + html + '</div>';
    document.body.appendChild(o);
    o.addEventListener("click", function(e){ if (e.target === o) close(); });
    function onKey(e){ if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    function close(){ document.removeEventListener("keydown", onKey); o.remove(); }
    var f = o.querySelector("button"); if (f) f.focus();
    return { el:o, close:close };
  }

  /* ---------- drawn view: what the family sees ---------- */
  function renderDrawn(){
    var meKey = "ss-me-" + STATE.salt;
    var me = LS.get(meKey);
    if (typeof me !== "number" || !STATE.names[me]) me = null;

    var h = '<header class="head"><p class="eyebrow">Names are drawn</p><h1>' + esc(STATE.title) + '</h1>' + metaChips(STATE) + '</header>';
    if (me !== null){
      h += '<section class="panel welcome"><div><h2>Hi ' + esc(STATE.names[me]) + '</h2><p class="muted small">You already opened yours on this device.</p></div>' +
           '<div class="btn-row"><button class="btn btn-primary" id="again">See my person</button></div>' +
           '<p class="small muted" style="width:100%">Not ' + esc(STATE.names[me]) + '? <button class="link" id="notme">Pick a different name</button></p></section>';
    } else {
      h += '<section class="head"><h2>Who are you?</h2><p class="muted">Tap your own name to find out who you\'re buying for. Only open yours so it stays a surprise.</p></section>';
      h += '<div class="names">' + STATE.names.map(function(n,i){ return '<button class="name-btn" data-i="' + i + '">' + esc(n) + '<span aria-hidden="true">›</span></button>'; }).join("") + '</div>';
    }
    if (STATE.note) h += '<div class="notice">' + esc(STATE.note).replace(/\n/g,"<br>") + '</div>';
    h += '<details class="org"><summary>Organizer tools</summary><div class="inner">' +
         '<p class="small muted">A message to paste in the group chat with this page\'s link:</p>' +
         '<pre class="copy" id="chatmsg">' + esc(chatMessage()) + '</pre>' +
         '<div class="btn-row"><button class="btn btn-ghost" id="copy">Copy group message</button><button class="btn btn-ghost" id="reset">Start over</button></div>' +
         '<p class="msg" id="orgmsg" aria-live="polite"></p></div></details>';
    app.innerHTML = h;

    var orgmsg = document.getElementById("orgmsg");
    app.querySelectorAll(".name-btn").forEach(function(b){ b.addEventListener("click", function(){ confirmName(+b.getAttribute("data-i")); }); });
    var ag = document.getElementById("again"); if (ag) ag.addEventListener("click", function(){ reveal(me); });
    var nm = document.getElementById("notme"); if (nm) nm.addEventListener("click", function(){ LS.del(meKey); renderDrawn(); });
    document.getElementById("copy").addEventListener("click", function(){ copyText(chatMessage(), orgmsg); });
    document.getElementById("reset").addEventListener("click", function(){
      var md = modal('<h2>Start over?</h2><p class="muted">This throws out the current draw. Everyone will need to open the page again to see their new person. Names and settings are kept.</p>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="m-no">Keep the draw</button><button class="btn btn-danger" id="m-yes">Start over</button></div><p class="msg" id="m-msg" aria-live="polite"></p>');
      md.el.querySelector("#m-no").addEventListener("click", md.close);
      md.el.querySelector("#m-yes").addEventListener("click", function(){
        var st = { drawn:false, title:STATE.title, budget:STATE.budget, date:STATE.date, note:STATE.note, names:STATE.names, pairs:STATE.pairs || [] };
        save(st, md.el.querySelector("#m-msg"));
      });
    });

    function confirmName(i){
      var md = modal('<p class="eyebrow">Just checking</p><h2>Are you ' + esc(STATE.names[i]) + '?</h2><p class="muted">If not, go back. Peeking at someone else\'s spoils their surprise.</p>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="m-no">Go back</button><button class="btn btn-primary" id="m-yes">Yes, that\'s me</button></div>');
      md.el.querySelector("#m-no").addEventListener("click", md.close);
      md.el.querySelector("#m-yes").addEventListener("click", function(){ md.close(); LS.set(meKey, i); renderDrawn(); reveal(i); });
    }
  }

  function reveal(i){
    var target = STATE.names[decodeOne(STATE.enc, STATE.salt, i)] || "?";
    var md = modal('<p class="eyebrow">' + esc(STATE.names[i]) + ', your gift is for…</p>' +
      '<div class="gift-wrap"><button class="gift" id="gift" aria-label="Open the gift"><div class="box"><div class="rib-v"></div></div><div class="lid"><div class="rib-v"></div><div class="bow"></div></div></button></div>' +
      '<p class="tap-note" id="tapnote">Tap the present to open it</p>' +
      '<div class="result hidden" id="result" aria-live="polite"><div class="who">' + esc(target) + '</div>' + metaChips(STATE) +
      '<p class="small muted">Keep it a secret. Take a screenshot if you think you\'ll forget.</p></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="m-done">Close</button></div>');
    var g = md.el.querySelector("#gift");
    function open(){ g.classList.add("open"); md.el.querySelector("#tapnote").style.display = "none"; setTimeout(function(){ md.el.querySelector("#result").classList.remove("hidden"); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450); }
    g.addEventListener("click", open);
    g.focus();
    md.el.querySelector("#m-done").addEventListener("click", md.close);
  }

  function chatMessage(){
    var s = "🎄 " + STATE.title + " names are drawn! Open the link, tap YOUR name, and only look at your own.";
    if (STATE.budget) s += "\nBudget: " + STATE.budget;
    if (STATE.date) s += "\nGift exchange: " + fmtDate(STATE.date);
    return s;
  }

  /* ---------- setup view: organizer enters names and draws ---------- */
  function renderSetup(){
    var draft = LS.get("ss-draft") || {};
    var st = {
      title: draft.title != null ? draft.title : STATE.title,
      budget: draft.budget != null ? draft.budget : STATE.budget,
      date: draft.date != null ? draft.date : STATE.date,
      note: draft.note != null ? draft.note : STATE.note,
      namesText: draft.namesText != null ? draft.namesText : (STATE.names || []).join("\n"),
      pairs: draft.pairs || STATE.pairs || []
    };

    app.innerHTML =
      '<header class="head"><p class="eyebrow">Not drawn yet</p><h1>' + esc(st.title || "Family Secret Santa") + '</h1>' +
      '<p class="muted">If you\'re family: check back once names are drawn. If you\'re organizing: fill this in, then draw. Nobody sees the full list, including you.</p></header>' +
      '<section class="panel">' +
        '<div><label for="f-title">Group name</label><input type="text" id="f-title" maxlength="60" value="' + esc(st.title) + '"></div>' +
        '<div class="row2"><div><label for="f-budget">Spending limit</label><input type="text" id="f-budget" maxlength="30" placeholder="$50" value="' + esc(st.budget) + '"></div>' +
        '<div><label for="f-date">Gift exchange day</label><input type="date" id="f-date" value="' + esc(st.date) + '"></div></div>' +
      '</section>' +
      '<section class="panel">' +
        '<div><label for="f-names">Who\'s in?</label><textarea id="f-names" placeholder="One name per line&#10;Mom&#10;Dad&#10;Grandma">' + esc(st.namesText) + '</textarea>' +
        '<p class="hint" id="n-count"></p></div>' +
      '</section>' +
      '<section class="panel">' +
        '<div><h2>Couples and housemates</h2><p class="hint">Add pairs who shouldn\'t draw each other. Optional.</p></div>' +
        '<div class="pair-add"><select id="p-a" aria-label="First person"></select><span class="amp">&amp;</span><select id="p-b" aria-label="Second person"></select><button class="btn btn-ghost" id="p-add">Add pair</button></div>' +
        '<ul class="pairs" id="pairs"></ul>' +
      '</section>' +
      '<section class="panel">' +
        '<div><label for="f-note">Note for everyone</label><textarea id="f-note" style="min-height:80px" maxlength="400" placeholder="Wishlists go in the group chat by Dec 1. Gag gifts welcome.">' + esc(st.note) + '</textarea><p class="hint">Optional. Shown on the page and with each reveal.</p></div>' +
      '</section>' +
      '<div class="btn-row"><button class="btn btn-primary" id="go">Draw names</button></div>' +
      '<p class="msg" id="msg" aria-live="polite"></p>';

    var $ = function(id){ return document.getElementById(id); };
    function names(){
      var seen = {}, out = [];
      $("f-names").value.split(/\n|,/).forEach(function(n){ n = n.trim().replace(/\s+/g," "); var k = n.toLowerCase(); if (n && !seen[k]){ seen[k] = 1; out.push(n); } });
      return out;
    }
    function persist(){ LS.set("ss-draft", { title:$("f-title").value, budget:$("f-budget").value, date:$("f-date").value, note:$("f-note").value, namesText:$("f-names").value, pairs:st.pairs }); }
    function refresh(){
      var ns = names();
      st.pairs = st.pairs.filter(function(p){ return ns.indexOf(p[0]) > -1 && ns.indexOf(p[1]) > -1; });
      $("n-count").textContent = ns.length ? ns.length + (ns.length === 1 ? " person" : " people") + (ns.length < 3 ? " · add at least 3" : "") : "Add at least 3 people, one per line.";
      var opts = ns.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join("");
      var a = $("p-a").value, b = $("p-b").value;
      $("p-a").innerHTML = opts; $("p-b").innerHTML = opts;
      if (ns.indexOf(a) > -1) $("p-a").value = a;
      if (ns.indexOf(b) > -1) $("p-b").value = b; else if (ns.length > 1) $("p-b").selectedIndex = 1;
      $("pairs").innerHTML = st.pairs.map(function(p, i){ return '<li><span>' + esc(p[0]) + ' &amp; ' + esc(p[1]) + '</span><button class="x" data-i="' + i + '" aria-label="Remove ' + esc(p[0]) + ' and ' + esc(p[1]) + '">×</button></li>'; }).join("");
      $("pairs").querySelectorAll(".x").forEach(function(x){ x.addEventListener("click", function(){ st.pairs.splice(+x.getAttribute("data-i"), 1); refresh(); persist(); }); });
      $("go").disabled = ns.length < 3;
    }
    ["f-title","f-budget","f-date","f-note"].forEach(function(id){ $(id).addEventListener("input", persist); });
    $("f-names").addEventListener("input", function(){ refresh(); persist(); });
    $("p-add").addEventListener("click", function(){
      var a = $("p-a").value, b = $("p-b").value, m = $("msg");
      if (!a || !b || a === b){ m.className = "msg err"; m.textContent = "Pick two different people for a pair."; return; }
      if (st.pairs.some(function(p){ return (p[0]===a && p[1]===b) || (p[0]===b && p[1]===a); })) return;
      st.pairs.push([a,b]); m.textContent = ""; refresh(); persist();
    });
    $("go").addEventListener("click", function(){
      var ns = names(), m = $("msg");
      if (ns.length < 3){ m.className = "msg err"; m.textContent = "Add at least 3 people."; return; }
      var perm = drawNames(ns.length, st.pairs, ns);
      if (!perm){ m.className = "msg err"; m.textContent = "Those pairs make a fair draw impossible. Remove a pair or add more people."; return; }
      var md = modal('<h2>Draw names for ' + ns.length + ' people?</h2><p class="muted">The page locks in the draw and shows the name picker. You won\'t see anyone\'s match but your own.</p>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="m-no">Not yet</button><button class="btn btn-primary" id="m-yes">Draw and lock it in</button></div><p class="msg" id="m-msg" aria-live="polite"></p>');
      md.el.querySelector("#m-no").addEventListener("click", md.close);
      md.el.querySelector("#m-yes").addEventListener("click", function(){
        md.el.querySelector("#m-yes").disabled = true;
        var salt = new Uint32Array(1); crypto.getRandomValues(salt);
        var out = { drawn:true, title:($("f-title").value.trim() || "Family Secret Santa"), budget:$("f-budget").value.trim(), date:$("f-date").value, note:$("f-note").value.trim(),
          names:ns, pairs:st.pairs, salt:salt[0], enc:encode(perm, salt[0]), drawnAt:new Date().toISOString().slice(0,10) };
        save(out, md.el.querySelector("#m-msg")).then(function(ok){ if (ok) LS.del("ss-draft"); else md.el.querySelector("#m-yes").disabled = false; });
      });
    });
    refresh();
  }

  if (STATE.drawn && STATE.enc && STATE.names && STATE.names.length) renderDrawn(); else renderSetup();

  /* ---------- light snowfall ---------- */
  (function(){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.getElementById("snow"); if (!c || !c.getContext) return;
    var x = c.getContext("2d"), flakes = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    function size(){ W = c.clientWidth; H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr,0,0,dpr,0,0); }
    size(); window.addEventListener("resize", size);
    var count = Math.round(Math.min(70, W * H / 14000));
    for (var i=0;i<count;i++) flakes.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+0.6, s:Math.random()*0.4+0.2, d:Math.random()*Math.PI*2 });
    function tick(){
      x.clearRect(0,0,W,H); x.fillStyle = "rgba(244,241,232,0.55)";
      for (var i=0;i<flakes.length;i++){ var f = flakes[i]; f.y += f.s; f.d += 0.01; f.x += Math.sin(f.d) * 0.25;
        if (f.y > H + 4){ f.y = -4; f.x = Math.random()*W; }
        x.beginPath(); x.arc(f.x, f.y, f.r, 0, Math.PI*2); x.fill(); }
      requestAnimationFrame(tick);
    }
    tick();
  })();
})();
</script>
</body>
</html>
